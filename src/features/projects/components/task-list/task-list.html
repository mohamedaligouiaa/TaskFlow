@if (tasks().length === 0) {
  <p class="text-sm italic text-gray-500">Aucune tâche.</p>
} @else {
  <ul class="space-y-2">
    @for (task of tasks(); track task.id) {
      <li
        class="flex items-center justify-between rounded border-l-4 bg-gray-50 px-3 py-2"
        [class]="borderClass(task.status)"
      >
        <div>
          <p class="font-medium text-gray-800">{{ task.title }}</p>
          <p class="text-xs text-gray-500">Priorité : {{ task.priority }}</p>
        </div>
        <span
          class="rounded-full px-2 py-1 text-xs font-semibold"
          [class]="badgeClass(task.status)"
        >
          {{ task.status }}
        </span>
      </li>
    }
  </ul>
}
