<ul class="space-y-3" role="list">
  @for (task of tasks(); track task.id) {
    <li>
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [assigneeName]="assigneeName(task)"
        (taskStatusChange)="taskStatusChange.emit({ taskId: task.id, status: $event })"
        (taskDelete)="taskDelete.emit(task.id)"
      />
    </li>
  } @empty {
    <li class="text-sm text-gray-400 italic">Aucune tâche</li>
  }
</ul>
