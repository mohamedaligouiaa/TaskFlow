<div class="flex items-center gap-4 rounded-3xl border border-white/60 bg-white/55 p-5 shadow-xl shadow-indigo-500/10
            backdrop-blur-xl transition duration-300 hover:-translate-y-1 hover:bg-white/70">
  <!-- Pastille d'initiales (couleur selon le rôle) -->
  <div
    class="w-14 h-14 shrink-0 rounded-full flex items-center justify-center
           text-white text-lg font-bold tracking-wide shadow-md ring-4 ring-gray-100"
    [ngStyle]="{ 'background-color': avatarColor }"
  >
    {{ user.name | initials }}
  </div>

  <div class="min-w-0 flex-1">
    <p class="font-semibold text-gray-900 truncate">{{ user.name | titlecase }}</p>
    <p class="text-sm text-gray-500 truncate">{{ user.email | lowercase }}</p>

    <div class="mt-2 flex flex-wrap items-center gap-2">
      <!-- Rôle -->
      <span class="text-xs font-medium text-gray-600 bg-gray-100 px-2 py-0.5 rounded-md">
        {{ user.role }}
      </span>

      <!-- Badge Actif / Inactif -->
      <span
        class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium"
        [ngClass]="user.active
          ? 'bg-green-100 text-green-800'
          : 'bg-gray-200 text-gray-600'"
      >
        <span
          class="w-1.5 h-1.5 rounded-full"
          [ngClass]="user.active ? 'bg-green-500' : 'bg-gray-400'"
        ></span>
        {{ user.active ? 'Actif' : 'Inactif' }}
      </span>
    </div>
  </div>
</div>
