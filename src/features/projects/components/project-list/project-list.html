<section class="mx-auto max-w-5xl p-6">
  <h1 class="mb-6 text-3xl font-bold text-gray-900">Mes projets</h1>

  <input
    type="text"
    placeholder="Rechercher un projet..."
    [(ngModel)]="searchTerm"
    class="mb-6 w-full rounded border border-gray-300 bg-white px-4 py-2 focus:border-indigo-500 focus:outline-none"
  />

  <div class="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    @for (project of filteredProjects(); track project.id) {
      <app-project-card
        [project]="project"
        (projectSelected)="onProjectSelected($event)"
      />
    } @empty {
      <p class="text-gray-500">Aucun projet trouvé.</p>
    }
  </div>
</section>
