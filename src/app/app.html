<!-- Fond fixe : dégradé + halos flous -->
<div aria-hidden="true"
     class="fixed inset-0 -z-10 overflow-hidden bg-gradient-to-br from-indigo-100 via-sky-50 to-fuchsia-100">
  <div class="absolute -left-24 -top-32 h-96 w-96 rounded-full bg-indigo-400/30 blur-3xl"></div>
  <div class="absolute right-0 top-1/3 h-[28rem] w-[28rem] rounded-full bg-fuchsia-300/30 blur-3xl"></div>
  <div class="absolute -bottom-32 left-1/4 h-96 w-96 rounded-full bg-sky-300/30 blur-3xl"></div>
</div>

<div class="min-h-screen text-slate-800">
  <header class="sticky top-0 z-20 border-b border-white/50 bg-white/50 backdrop-blur-xl">
    <div class="mx-auto flex max-w-6xl items-center gap-3 px-6 py-4">
      <span class="grid h-9 w-9 place-items-center rounded-xl bg-gradient-to-br from-indigo-500 to-fuchsia-500 text-lg text-white shadow-lg shadow-indigo-500/30">✓</span>
      <p class="text-xl font-bold tracking-tight text-slate-900">
        Task<span class="text-indigo-600">Flow</span>
      </p>
    </div>
  </header>

  <main class="mx-auto max-w-6xl space-y-12 px-6 py-10">
    <section aria-labelledby="projets-titre">
      <h2 id="projets-titre" class="mb-5 text-2xl font-bold tracking-tight text-slate-900">Projets</h2>
      <app-project-list />
    </section>

    <section aria-labelledby="equipe-titre">
      <h2 id="equipe-titre" class="mb-5 text-2xl font-bold tracking-tight text-slate-900">Équipe</h2>
      <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
        @for (u of users; track u.id) {
          <app-user-card [user]="u" />
        }
      </div>
    </section>
  </main>
</div>
